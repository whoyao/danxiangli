name: Daily Image Processor

on:
  schedule:
    # 每天 UTC 15:00 运行
    - cron: '0 15 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

# 同一时间只跑一个实例（定时与手动触发重叠时排队，而不是并发抢着推送 main）
concurrency:
  group: daily-image
  cancel-in-progress: false

jobs:
  process-image:
    runs-on: ubuntu-latest
    # 注意：不要用 matrix 做"重试"——matrix 是并行跑多份，会互相抢推 main 导致 push 被拒。
    # 重试由下面各步骤里的 nick-fields/retry 负责。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Pillow requests
      
      - name: Process daily image (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 120  # 失败后等待2分钟再重试
          warning_on_retry: true
          command: |
            python scripts/process_image.py
      
      - name: Commit and push changes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add images/latest.jpg
            git diff --staged --quiet || git commit -m "Update daily image - $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 远端若已有新提交，先变基再推；latest.jpg 冲突时以本次生成的为准（变基时 theirs=本地提交）
            git pull --rebase -X theirs origin main
            git push
